[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saude-brasil-insights"
version = "0.2.0"
description = "Painel reproduzivel de acesso a saude nos municipios brasileiros"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro" }]
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "plotly>=6.0,<7.0",
  "requests>=2.32,<3.0",
  "streamlit>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
saude-brasil-update = "saude_brasil_insights.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
